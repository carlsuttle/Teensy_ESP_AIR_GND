[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -DTELEM_ACTIVE_SCHEMA_ID=TELEM_SCHEMA_ID_RELEASE_0_03_CANDIDATE
    -DGND_FORCE_FACTORY_RESET_ON_BOOT=0
    -DGND_STA_ENABLE_DEFAULT=1
    -DGND_STA_TIMEOUT_MS_DEFAULT=15000
    -DGND_STA_SSID_DEFAULT='"carlsiPhone"'
    -DGND_STA_PASS_DEFAULT='"Vulcan1!"'

lib_deps =
  esp32async/ESPAsyncWebServer @ ^3.8.1
  bblanchon/ArduinoJson @ ^7.4.2
